<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет | BellaPizza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cabinet.css">
</head>
<body>

<header class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">BellaPizza</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">Історія</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Меню</a></li>
                <li class="nav-item"><a class="nav-link" href="news.html">Наші новини</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Контакти</a></li>

                <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                    <button class="btn btn-outline-warning btn-sm" id="logout-btn">
                        <i class="bi bi-box-arrow-right me-1"></i> Вийти
                    </button>
                </li>
            </ul>
        </div>
    </div>
</header>

<main class="user-cabinet">
    <div class="container">
        <div class="row">

            <!-- Ліва колонка з аватаром -->
            <div class="col-lg-4">
                <div class="profile-card text-center">
                    <img src="images/userphoto.png" alt="Аватар користувача" class="profile-avatar mb-3">
                    <h4 class="mb-1" id="profile-name">Користувач</h4>
                    <p class="text-muted" id="profile-email">email@example.com</p>
                    <button class="btn btn-outline-light mt-2 btn-sm" disabled>Змінити аватар</button>
                </div>
            </div>

            <!-- Права колонка з вкладками -->
            <div class="col-lg-8">
                <div class="details-card">
                    <ul class="nav nav-tabs" id="myTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="personal-tab" data-bs-toggle="tab"
                                    data-bs-target="#personal" type="button">Особисті дані</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="history-tab" data-bs-toggle="tab"
                                    data-bs-target="#history" type="button">Історія замовлень</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="discounts-tab" data-bs-toggle="tab"
                                    data-bs-target="#discounts" type="button">Ваші знижки</button>
                        </li>
                    </ul>

                    <div class="tab-content p-4" id="myTabContent">
                        <!-- Особисті дані -->
                        <div class="tab-pane fade show active" id="personal">
                            <form id="personal-form">
                                <div class="row">
                                    <div class="col-md-12 mb-3">
                                        <label class="form-label">Ім'я:</label>
                                        <input type="text" class="form-control" id="personal-name" readonly>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email:</label>
                                    <input type="email" class="form-control" id="personal-email" readonly>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Телефон:</label>
                                    <input type="tel" class="form-control" id="personal-phone" readonly>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Адреса:</label>
                                    <input type="text" class="form-control" id="personal-address" readonly>
                                </div>

                                <button type="button" class="btn custom-btn mt-3" id="edit-profile-btn">
                                    Редагувати інформацію
                                </button>
                            </form>
                        </div>

                        <!-- Історія замовлень -->
                        <div class="tab-pane fade" id="history">
                            <ul class="list-group list-group-flush" id="orders-list">
                                <!-- Динамічно підтягуємо замовлення -->
                            </ul>
                        </div>

                        <!-- Ваші знижки -->
                        <div class="tab-pane fade" id="discounts">
                            <div id="discounts-list">
                                <!-- Динамічно підтягуємо акції -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Модальне вікно редагування профілю -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title">Редагування профілю</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Ім'я</label>
          <input id="edit-name" class="form-control" type="text">
        </div>

        <div class="mb-2">
          <label class="form-label">Email</label>
          <input id="edit-email" class="form-control" type="email">
        </div>

        <div class="mb-2">
          <label class="form-label">Телефон</label>
          <input id="edit-phone" class="form-control" type="tel">
        </div>

        <div class="mb-3">
          <label class="form-label">Адреса</label>
          <input id="edit-address" class="form-control" type="text">
        </div>

        <hr>

        <p class="mb-2">Зміна пароля (необов'язково):</p>

        <div class="mb-2">
          <label class="form-label">Старий пароль</label>
          <input id="old-password" class="form-control" type="password">
        </div>

        <div class="mb-2">
          <label class="form-label">Новий пароль</label>
          <input id="new-password" class="form-control" type="password">
        </div>

        <div class="mb-2">
          <label class="form-label">Повтор нового пароля</label>
          <input id="new-password-confirm" class="form-control" type="password">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
        <button class="btn btn-warning" id="save-profile-btn">Зберегти</button>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
    <div class="container">
        <p class="text-center text-muted mb-0">&copy; 2025 BellaPizza. Всі права захищені.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/cabinet.js"></script>
</body>
</html>
